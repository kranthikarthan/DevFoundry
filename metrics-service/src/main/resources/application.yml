server:
  port: 8084
  servlet:
    context-path: /api

spring:
  application:
    name: metrics-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,metricsdistribution
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    metrics:
      enabled: true
      distribution:
        percentiles-histogram:
          http.server.requests: true
        percentiles:
          http.server.requests: 0.5, 0.95, 0.99
        sla:
          http.server.requests: 100ms, 500ms
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      sla:
        http.server.requests: 100ms, 500ms

logging:
  level:
    com.supernova.integration: DEBUG
    org.springframework.web: DEBUG
    io.micrometer: DEBUG

info:
  app:
    name: ${spring.application.name}
    description: Metrics Service for Developer Portal
    version: 1.0.0