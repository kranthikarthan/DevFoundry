name: CI
on:
  push:
    branches: [ main, trunk, master, '**' ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Docker build (api)
        run: docker build -t devportal-api ./api
      - name: Docker build (web)
        run: docker build -t devportal-web ./web
  java-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build Spring templates
        run: mvn -q -DskipTests package -f templates/spring/pom.xml
