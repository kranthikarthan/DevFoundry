name: Bug report
description: Report a problem
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      value: |
        1.
        2.
        3.
  - type: input
    id: version
    attributes:
      label: Version(s)
      placeholder: api@x.y.z, web@x.y.z
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
